<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <!-- window frame -->
  <rect x="0" y="0" width="720" height="460" rx="14" fill="#070809"/>
  <rect x="0.5" y="0.5" width="719" height="459" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- titlebar -->
  <rect x="0" y="0" width="720" height="34" rx="14" fill="#0B0D10"/>
  <rect x="0" y="0" width="720" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="18" cy="17" r="5" fill="#FF5F57" fill-opacity="0.6"/>
  <circle cx="36" cy="17" r="5" fill="#FEBC2E" fill-opacity="0.6"/>
  <circle cx="54" cy="17" r="5" fill="#28C840" fill-opacity="0.6"/>
  <text x="360" y="21" text-anchor="middle" fill="#8B93A1" font-size="11">Nexel Guard — Scan Results</text>

  <!-- main content -->
  <g transform="translate(40 64)">
    <!-- summary header -->
    <g>
      <circle cx="14" cy="0" r="6" fill="#0066FF" fill-opacity="0.2"/>
      <circle cx="14" cy="0" r="3" fill="#3B82F6"/>
      <text x="30" y="4" fill="#F5F7FA" font-size="16" font-weight="600">Scan complete</text>
      <text x="640" y="4" text-anchor="end" fill="#8B93A1" font-size="11">128,431 files · 06:08 elapsed</text>
    </g>

    <!-- tabs -->
    <g transform="translate(0 26)" font-size="11">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#0066FF" fill-opacity="0.12"/>
      <text x="35" y="17" text-anchor="middle" fill="#60A5FA" font-weight="500">Threats</text>

      <text x="100" y="17" fill="#8B93A1">Clean</text>
      <text x="160" y="17" fill="#8B93A1">Skipped</text>
      <text x="230" y="17" fill="#8B93A1">Errors</text>
    </g>

    <!-- table header -->
    <g transform="translate(0 72)" font-size="10" fill="#6B7280">
      <text x="0" y="0">FILE</text>
      <text x="320" y="0">CATEGORY</text>
      <text x="450" y="0">STATUS</text>
      <text x="640" y="0" text-anchor="end">ACTION</text>
    </g>
    <line x1="0" y1="80" x2="640" y2="80" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <!-- empty state: zero threats -->
    <g transform="translate(320 200)">
      <circle r="36" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5" fill="#0066FF" fill-opacity="0.06"/>
      <path d="M-14 0 L-4 10 L14 -10" stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="62" text-anchor="middle" fill="#F5F7FA" font-size="14" font-weight="500">No threats found</text>
      <text y="82" text-anchor="middle" fill="#8B93A1" font-size="11">Your system is clean.</text>
    </g>

    <!-- sample rows (lower opacity, illustrative) -->
    <g transform="translate(0 100)" font-size="11">
      <text x="0" y="14" fill="#A7ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C:\Windows\System32\notepad.exe</text>
      <text x="320" y="14" fill="#8B93A1">System</text>
      <g transform="translate(450 4)">
        <circle cx="6" cy="6" r="3" fill="#3B82F6"/>
        <text x="14" y="10" fill="#60A5FA" font-size="10">CLEAN</text>
      </g>
      <text x="640" y="14" text-anchor="end" fill="#6B7280" font-size="10">—</text>
    </g>

    <g transform="translate(0 124)" font-size="11">
      <text x="0" y="14" fill="#A7ADB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">D:\Projects\sample.dll</text>
      <text x="320" y="14" fill="#8B93A1">Library</text>
      <g transform="translate(450 4)">
        <circle cx="6" cy="6" r="3" fill="#3B82F6"/>
        <text x="14" y="10" fill="#60A5FA" font-size="10">CLEAN</text>
      </g>
      <text x="640" y="14" text-anchor="end" fill="#6B7280" font-size="10">—</text>
    </g>

    <!-- footer -->
    <g transform="translate(0 380)">
      <rect x="0" y="0" width="100" height="32" rx="6" fill="#0066FF" fill-opacity="0.18"/>
      <text x="50" y="20" text-anchor="middle" fill="#60A5FA" font-size="11" font-weight="500">EXPORT</text>

      <rect x="110" y="0" width="100" height="32" rx="6" fill="#0D1014" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="160" y="20" text-anchor="middle" fill="#A7ADB7" font-size="11">RESCAN</text>

      <text x="640" y="20" text-anchor="end" fill="#6B7280" font-size="10">NXL // CORE 0.1.4</text>
    </g>
  </g>
</svg>
