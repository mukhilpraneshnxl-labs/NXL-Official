<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <radialGradient id="ogBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="ogGlow" cx="78%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- subtle grid -->
  <g stroke="#3B82F6" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- decorative rings -->
  <g stroke="#3B82F6" fill="none">
    <circle cx="980" cy="315" r="200" stroke-opacity="0.10"/>
    <circle cx="980" cy="315" r="150" stroke-opacity="0.16"/>
    <circle cx="980" cy="315" r="100" stroke-opacity="0.30"/>
    <circle cx="980" cy="315" r="50" stroke-opacity="0.55"/>
  </g>

  <g transform="translate(980 315)">
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" stroke="#60A5FA" stroke-width="1" fill="#0066FF" fill-opacity="0.4"/>
    <rect x="-2" y="-2" width="4" height="4" transform="rotate(45)" fill="#60A5FA"/>
  </g>

  <!-- text -->
  <text x="80" y="180" fill="#3B82F6" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NXL // SYSTEMS</text>
  <text x="80" y="280" fill="#F5F7FA" font-size="72" font-weight="700">Nexel Labs</text>
  <text x="80" y="360" fill="#F5F7FA" font-size="40" font-weight="500">Engineering what comes next.</text>
  <text x="80" y="420" fill="#A7ADB7" font-size="22">Modern software &amp; security technology.</text>

  <text x="80" y="560" fill="#6B7280" font-size="14">nexellabs.io</text>
</svg>
