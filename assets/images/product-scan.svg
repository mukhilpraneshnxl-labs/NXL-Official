<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="progressFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- window frame -->
  <rect x="0" y="0" width="720" height="460" rx="14" fill="#070809"/>
  <rect x="0.5" y="0.5" width="719" height="459" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- titlebar -->
  <rect x="0" y="0" width="720" height="34" rx="14" fill="#0B0D10"/>
  <rect x="0" y="0" width="720" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="18" cy="17" r="5" fill="#FF5F57" fill-opacity="0.6"/>
  <circle cx="36" cy="17" r="5" fill="#FEBC2E" fill-opacity="0.6"/>
  <circle cx="54" cy="17" r="5" fill="#28C840" fill-opacity="0.6"/>
  <text x="360" y="21" text-anchor="middle" fill="#8B93A1" font-size="11">Nexel Guard — Scan</text>

  <!-- main content -->
  <g transform="translate(40 70)">
    <text x="0" y="0" fill="#F5F7FA" font-size="20" font-weight="600">Full System Scan</text>
    <text x="0" y="22" fill="#8B93A1" font-size="12">Scanning all local drives and running processes</text>

    <!-- big circular progress -->
    <g transform="translate(320 200)">
      <circle r="84" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="10" fill="none"/>
      <circle r="84" stroke="url(#progressFill)" stroke-width="10" fill="none"
              stroke-dasharray="527.79" stroke-dashoffset="158.34" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text y="-2" text-anchor="middle" fill="#F5F7FA" font-size="32" font-weight="600">70%</text>
      <text y="22" text-anchor="middle" fill="#8B93A1" font-size="11">scanned</text>
    </g>

    <!-- file path being scanned -->
    <g transform="translate(0 340)">
      <text x="0" y="0" fill="#8B93A1" font-size="10">CURRENTLY SCANNING</text>
      <text x="0" y="18" fill="#F5F7FA" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C:\Users\Mukhil\Documents\report.pdf</text>
    </g>

    <!-- stats row -->
    <g transform="translate(40 220)" font-size="11">
      <text fill="#8B93A1">Files</text>
      <text y="18" fill="#F5F7FA" font-size="16" font-weight="600">89,901</text>
      <text y="34" fill="#6B7280">/ 128,431</text>
    </g>
    <g transform="translate(560 220)" font-size="11" text-anchor="end">
      <text fill="#8B93A1">Threats</text>
      <text y="18" fill="#F5F7FA" font-size="16" font-weight="600">0</text>
      <text y="34" fill="#6B7280">detected</text>
    </g>
    <g transform="translate(160 220)" font-size="11">
      <text fill="#8B93A1">Elapsed</text>
      <text y="18" fill="#F5F7FA" font-size="16" font-weight="600">04:21</text>
      <text y="34" fill="#6B7280">of ~06:10</text>
    </g>
    <g transform="translate(480 220)" font-size="11" text-anchor="end">
      <text fill="#8B93A1">Rate</text>
      <text y="18" fill="#F5F7FA" font-size="16" font-weight="600">342</text>
      <text y="34" fill="#6B7280">files / sec</text>
    </g>

    <!-- bottom controls -->
    <g transform="translate(0 380)">
      <rect x="0" y="0" width="90" height="32" rx="6" fill="#0066FF" fill-opacity="0.18"/>
      <text x="45" y="20" text-anchor="middle" fill="#60A5FA" font-size="11" font-weight="500">PAUSE</text>

      <rect x="100" y="0" width="90" height="32" rx="6" fill="#0D1014" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="145" y="20" text-anchor="middle" fill="#A7ADB7" font-size="11">STOP</text>

      <text x="640" y="20" text-anchor="end" fill="#6B7280" font-size="10">NXL // CORE 0.1.4</text>
    </g>
  </g>
</svg>
