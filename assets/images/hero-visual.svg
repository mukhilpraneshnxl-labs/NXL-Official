<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B0D10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0066FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft background glow -->
  <circle cx="400" cy="400" r="400" fill="url(#bgGrad)"/>
  <circle cx="400" cy="400" r="180" fill="url(#coreGlow)"/>

  <!-- precision rings -->
  <g stroke="#3B82F6" fill="none">
    <circle cx="400" cy="400" r="340" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="400" cy="400" r="260" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="400" cy="400" r="190" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="400" cy="400" r="120" stroke-opacity="0.30" stroke-width="1"/>
    <circle cx="400" cy="400" r="60" stroke-opacity="0.50" stroke-width="1"/>
  </g>

  <!-- ring tick marks -->
  <g stroke="#3B82F6" stroke-width="1" fill="none">
    <line x1="400" y1="60" x2="400" y2="70" stroke-opacity="0.45"/>
    <line x1="400" y1="730" x2="400" y2="740" stroke-opacity="0.45"/>
    <line x1="60" y1="400" x2="70" y2="400" stroke-opacity="0.45"/>
    <line x1="730" y1="400" x2="740" y2="400" stroke-opacity="0.45"/>
    <line x1="155" y1="155" x2="162" y2="162" stroke-opacity="0.35"/>
    <line x1="645" y1="155" x2="638" y2="162" stroke-opacity="0.35"/>
    <line x1="155" y1="645" x2="162" y2="638" stroke-opacity="0.35"/>
    <line x1="645" y1="645" x2="638" y2="638" stroke-opacity="0.35"/>
  </g>

  <!-- connecting paths -->
  <g stroke="url(#lineGrad)" stroke-width="1" fill="none" stroke-opacity="0.7">
    <path d="M120 200 L300 280 L260 360 L400 320 L420 480 L260 520 L320 600 L160 560" stroke-opacity="0.35"/>
    <path d="M680 240 L520 280 L560 380 L400 340 L380 480 L540 540 L480 620 L640 580" stroke-opacity="0.35"/>
  </g>

  <!-- thin radial lines from center -->
  <g stroke="#3B82F6" stroke-width="1" fill="none">
    <line x1="400" y1="400" x2="60" y2="200" stroke-opacity="0.10"/>
    <line x1="400" y1="400" x2="740" y2="200" stroke-opacity="0.10"/>
    <line x1="400" y1="400" x2="60" y2="600" stroke-opacity="0.10"/>
    <line x1="400" y1="400" x2="740" y2="600" stroke-opacity="0.10"/>
    <line x1="400" y1="400" x2="400" y2="60" stroke-opacity="0.18"/>
    <line x1="400" y1="400" x2="400" y2="740" stroke-opacity="0.18"/>
    <line x1="400" y1="400" x2="120" y2="400" stroke-opacity="0.18"/>
    <line x1="400" y1="400" x2="680" y2="400" stroke-opacity="0.18"/>
  </g>

  <!-- nodes -->
  <g fill="#3B82F6">
    <circle cx="300" cy="280" r="3"/>
    <circle cx="260" cy="360" r="2"/>
    <circle cx="400" cy="320" r="2.5"/>
    <circle cx="420" cy="480" r="3"/>
    <circle cx="260" cy="520" r="2"/>
    <circle cx="320" cy="600" r="2.5"/>
    <circle cx="520" cy="280" r="2.5"/>
    <circle cx="560" cy="380" r="3"/>
    <circle cx="400" cy="340" r="2"/>
    <circle cx="380" cy="480" r="2.5"/>
    <circle cx="540" cy="540" r="3"/>
    <circle cx="480" cy="620" r="2"/>
  </g>

  <!-- center diamond -->
  <g transform="translate(400 400)">
    <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" stroke="#60A5FA" stroke-width="1" fill="#0066FF" fill-opacity="0.4"/>
    <rect x="-2" y="-2" width="4" height="4" transform="rotate(45)" fill="#60A5FA"/>
  </g>

  <!-- crosshair -->
  <g stroke="#3B82F6" stroke-width="1" fill="none" stroke-opacity="0.4">
    <line x1="395" y1="400" x2="370" y2="400"/>
    <line x1="405" y1="400" x2="430" y2="400"/>
    <line x1="400" y1="395" x2="400" y2="370"/>
    <line x1="400" y1="405" x2="400" y2="430"/>
  </g>

  <!-- coordinate markers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#3B82F6" fill-opacity="0.55">
    <text x="80" y="80">NXL-001</text>
    <text x="680" y="80" text-anchor="end">X 0.001</text>
    <text x="80" y="730">Y 0.001</text>
    <text x="680" y="730" text-anchor="end">SYS.ONLINE</text>
  </g>
</svg>
