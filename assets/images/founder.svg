<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <defs>
    <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1014"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="avGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="360" height="360" rx="16" fill="url(#avBg)" stroke="#3B82F6" stroke-opacity="0.20"/>
  <rect width="360" height="360" rx="16" fill="url(#avGlow)"/>

  <!-- subtle grid -->
  <g stroke="#3B82F6" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="360" y2="60"/>
    <line x1="0" y1="120" x2="360" y2="120"/>
    <line x1="0" y1="180" x2="360" y2="180"/>
    <line x1="0" y1="240" x2="360" y2="240"/>
    <line x1="0" y1="300" x2="360" y2="300"/>
    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
  </g>

  <!-- corner markers -->
  <g stroke="#3B82F6" stroke-width="1" fill="none">
    <path d="M16 24 L16 16 L24 16" stroke-opacity="0.6"/>
    <path d="M344 24 L344 16 L336 16" stroke-opacity="0.6"/>
    <path d="M16 336 L16 344 L24 344" stroke-opacity="0.6"/>
    <path d="M344 336 L344 344 L336 344" stroke-opacity="0.6"/>
  </g>

  <!-- monogram -->
  <defs>
    <linearGradient id="founderGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7CC8FF"/>
      <stop offset="45%" stop-color="#3DA9F0"/>
      <stop offset="100%" stop-color="#003FB8"/>
    </linearGradient>
    <linearGradient id="founderGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CC8FF"/>
      <stop offset="50%" stop-color="#3DA9F0"/>
      <stop offset="100%" stop-color="#003FB8"/>
    </linearGradient>
  </defs>
  <g transform="translate(180 180)">
    <circle r="64" stroke="#3DA9F0" stroke-opacity="0.18" fill="none"/>
    <circle r="48" stroke="#3DA9F0" stroke-opacity="0.30" fill="none"/>
    <g transform="scale(0.7)">
      <path d="M -42 -40 L -26 -40 L -26 40 L -42 40 Z" fill="#FFFFFF"/>
      <path d="M -26 -40 L -10 -40 L 22 40 L 6 40 Z" fill="#FFFFFF"/>
      <path d="M 36 -40 L 52 -40 L 6 40 L -10 40 Z" fill="url(#founderGrad1)"/>
      <path d="M -10 -40 L 6 -40 L 52 40 L 36 40 Z" fill="url(#founderGrad2)"/>
    </g>
  </g>

  <!-- footer label -->
  <text x="180" y="332" text-anchor="middle" fill="#8B93A1" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NXL-001 // FOUNDER</text>
</svg>
